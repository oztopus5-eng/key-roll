  for(let q=0;q<C;q++){let u=((q+off)/C)*per,x,y,a;
    if(u<w){x=u;y=-4;a=Math.PI/2}else if((u-=w)<h){x=w+4;y=u;a=Math.PI}else if((u-=h)<w){x=w-u;y=h+4;a=-Math.PI/2}else{u-=w;x=-4;y=h-u;a=0}
    const tx=w/2-x,ty=h*.45-y;let dl=Math.atan2(ty,tx)-a;dl=Math.atan2(Math.sin(dl),Math.cos(dl));a+=dl*.35;
    x+=(Math.random()-.5)*per/C*.4*(Math.abs(Math.sin(a))>.7?1:0);y+=(Math.random()-.5)*per/C*.4*(Math.abs(Math.sin(a))>.7?0:1);

  return out}
